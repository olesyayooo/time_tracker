services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-1}
      DB_HOST: db
      DB_PORT: "5432"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s
    init: true

  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tracker_tests
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracker_tests -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  tests:
    build:
      context: .
      target: tests
    profiles: [test]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tracker_tests
      POSTGRES_PASSWORD: test-only-password
      DB_HOST: test-db
      DB_PORT: "5432"
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes
      ALGORITHM: HS256
      TOKEN_EXPIRE_HOURS: "1"
    networks: [test]
    depends_on:
      test-db:
        condition: service_healthy
    init: true

volumes:
  postgres_data:

networks:
  test:
    internal: true
